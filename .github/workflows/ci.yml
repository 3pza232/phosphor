# PHOSPHOR CI：Windows + MSYS2 MinGW64 的构建与无头门禁。
# 不加 Linux job：CMakeLists 目前硬编码 Windows 的 GLFW 预编译库
# （extern/glfw-3.5.1.bin.WIN64），跨平台依赖解析另立任务。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 工具链（GCC / CMake / Ninja / Python + Pillow）
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pillow

      - name: 配置（Release + 单元测试）
        run: cmake --preset ci

      - name: 构建 phosphor 与 phosphor_tests
        run: cmake --build --preset ci

      - name: 纯逻辑单元测试
        working-directory: build-ci
        run: ./phosphor_tests.exe

      - name: 无头门禁（13 项：includes/api/unit/control/draw/layer/ui/scene/toolkit/lint/portable/cart/net）
        working-directory: build-ci
        run: python ../tools/run_checks.py

      # 性能预算不是门禁（共享 runner 的绝对值会抖）：跑一份报告附到 job summary 并留档，
      # 方便事后对比某个 PR 是否让某张卡带突然变慢
      - name: 性能预算报告（非门禁）
        working-directory: build-ci
        continue-on-error: true
        run: |
          python ../tools/perf_budget.py > perf-budget.txt
          { echo '## 性能预算（p95 update）'; echo '```'; cat perf-budget.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传性能预算报告
        if: always()
        uses: actions/upload-artifact`v4
        with:
          name: perf-budget
          path: build-ci/perf-budget.txt
          if-no-files-found: ignore
