# PHOSPHOR CI：Windows + MSYS2 MinGW64 的构建与无头门禁。
# 不加 Linux job：CMakeLists 目前硬编码 Windows 的 GLFW 预编译库
# （extern/glfw-3.5.1.bin.WIN64），跨平台依赖解析另立任务。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mingw64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Windows runner 的 Python stdout 默认 cp1252：门禁摘要里有中文，必须显式 UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSYS2 工具链（GCC / CMake / Ninja / Python + Pillow）
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pillow

      - name: 配置（Release + 单元测试）
        run: cmake --preset ci

      - name: 构建 phosphor 与 phosphor_tests
        run: cmake --build --preset ci

      - name: 纯逻辑单元测试
        working-directory: build-ci
        run: ./phosphor_tests.exe

      - name: 无头门禁（14 项：includes/api/unit/control/draw/layer/ui/scene/toolkit/lint/packs/portable/cart/net）
        working-directory: build-ci
        run: python ../tools/run_checks.py --json checks.json

      - name: 门禁摘要
        if: always()
        working-directory: build-ci
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          from pathlib import Path
          sys.stdout.reconfigure(encoding="utf-8")
          p = Path("checks.json")
          if not p.exists():
              print("## 门禁\n\n未生成 checks.json（构建/运行可能提前失败）")
              raise SystemExit
          data = json.loads(p.read_text(encoding="utf-8"))
          print("## 门禁\n")
          print("| gate | exit | seconds |")
          print("|---|---|---|")
          for gate in data["gates"]:
              print(f"| {gate['key']} | {gate['exit']} | {gate['seconds']} |")
          print()
          print("**结果**：" + ("全部通过" if data["ok"] else "失败：" + ", ".join(data["failures"])))
          PY

      # 性能预算不是门禁（共享 runner 的绝对值会抖）：跑一份报告附到 job summary 并留档，
      # 方便事后对比某个 PR 是否让某张卡带突然变慢
      - name: 性能预算报告（非门禁）
        working-directory: build-ci
        continue-on-error: true
        run: |
          python ../tools/perf_budget.py > perf-budget.txt
          { echo '## 性能预算（p95 update）'; echo '```'; cat perf-budget.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传性能预算报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget
          path: build-ci/perf-budget.txt
          if-no-files-found: ignore

      # 像素基线同样是"非门禁"：字体光栅化/驱动在不同 runner 上可能有细微差异。
      # 失败时把实际截图与指标带进日志，人工判断是真回归还是环境差异
      - name: 像素基线（非门禁）
        working-directory: build-ci
        continue-on-error: true
        run: python ../tools/pixel_golden.py

      - name: 上传像素基线截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-golden-shots
          path: build-ci/tests-out/pixel-golden
          if-no-files-found: ignore
